<style>
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#151823; --muted:#6B7280; --line:#E6E9F0;
  --plus:#0E9F6E; --minus:#E5484D; --gold:#FFB703; --chip:#F1F3F9;
  --shadow:0 2px 10px rgba(20,25,50,.06);
  --r:18px; --accent:#4F7CFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1117; --card:#181B23; --ink:#E9ECF3; --muted:#9AA3B2; --line:#262B36;
  --plus:#3DD68C; --minus:#FF6B6E; --chip:#212632; --shadow:0 2px 12px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px}
.brand span{font-size:20px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--chip);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.btn.solid{background:var(--ink);color:var(--card)}
.btn.gold{background:var(--gold);color:#1a1200}
.btn.ghost{border:1px solid var(--line);background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:active{transform:scale(.97)}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.kidcard{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);
  border:2px solid transparent;text-align:left;transition:.15s}
.kidcard.on{border-color:var(--accent)}
.kidcard .nm{font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:5px;align-items:center}
.kidcard .pt{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:4px}
.kidcard .won{font-size:12px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--card)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:-.2px}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.big{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1.05}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{font-size:11px;color:var(--muted)}
.amt{font-weight:800;font-size:15px;white-space:nowrap}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.badge.wait{background:#FFF3D6;color:#9A6B00}
.badge.ok{background:#DFF5EA;color:#0B7A53}
.badge.no{background:#FDE5E6;color:#B4262A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.wait{background:#3A2E10;color:#FFD98A}
 :root:not([data-theme="light"]) .badge.ok{background:#12352A;color:#7BE3B6}
 :root:not([data-theme="light"]) .badge.no{background:#3B1D1F;color:#FF9FA1}}
.check{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;background:transparent}
.check.on{background:var(--plus);border-color:var(--plus);color:#fff}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
label.f{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:10px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--chip);border-radius:11px;padding:8px 11px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.chip b{color:var(--plus)} .chip b.m{color:var(--minus)}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9A3C)}
.gbars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}
.gbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.gbars .p{background:var(--plus);border-radius:4px 4px 0 0;min-height:2px}
.gbars .m{background:var(--minus);border-radius:0 0 4px 4px;min-height:0}
.glabels{display:flex;gap:5px;margin-top:6px}
.glabels div{flex:1;text-align:center;font-size:9.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
.calc{background:var(--chip);border-radius:12px;padding:11px 12px;font-size:13px;font-weight:700;margin-top:10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);
  padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:1}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span>🪙</span> 우리집 포인트 통장</div>
    <button class="btn" id="modeBtn">👀 아이 모드</button>
  </header>
  <div class="kids" id="kids"></div>
  <div class="tabs" id="tabs"></div>
  <main id="view"><div class="card"><div class="empty">불러오는 중…</div></div></main>
</div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>
const SB="https://ytzhsnfqlzohxmdxocay.supabase.co", KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0emhzbmZxbHpvaHhtZHhvY2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMTc4MzUsImV4cCI6MjEwMzc5MzgzNX0.0xqV_G9t16-YdqtSIIhvSSCFIlu5T7ATf0-aY6cd5G0";
const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
const S={kids:[],bal:[],cats:[],rules:[],entries:[],todos:[],reqs:[],goals:[],daily:[],cfg:{},sel:1,tab:"today",pin:null};
const $=s=>document.querySelector(s);
const won=p=>(p*(S.cfg.won_per_point||100)).toLocaleString("ko-KR")+"원";
const todayKST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900);}
async function q(p){const c=new AbortController();const tm=setTimeout(()=>c.abort(),12000);try{const r=await fetch(SB+"/rest/v1/"+p,{headers:H,signal:c.signal});if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,140));return await r.json()}finally{clearTimeout(tm)}}
async function rpc(fn,b){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(b)});return r.json();}
async function admin(op,payload={}){const r=await rpc("kp_admin",{p_pin:S.pin,p_op:op,p_payload:payload});
  if(!r||r.ok===false){toast(r&&r.error?r.error:"실패했어요");return null}return r;}
async function kid(op,payload={}){const r=await rpc("kp_kid",{p_op:op,p_payload:payload});
  if(!r||r.ok===false){toast("실패했어요");return null}return r;}

async function load(){
  const[kids,bal,cats,rules,cfg,entries,todos,reqs,goals,daily]=await Promise.all([
    q("kp_child?select=*&order=sort"),
    q("kp_balance?select=*"),
    q("kp_category?select=*&order=sort"),
    q("kp_rule?select=*&active=eq.true&order=sort"),
    q("kp_config?select=*"),
    q("kp_entry?select=*&order=occurred_on.desc,id.desc&limit=600"),
    q("kp_todo?select=*&order=todo_date.desc,id.asc&limit=200"),
    q("kp_request?select=*&order=created_at.desc&limit=100"),
    q("kp_goal?select=*&order=created_at.desc"),
    q("kp_daily?select=*")
  ]);
  Object.assign(S,{kids,bal,cats,rules,entries,todos,reqs,goals,daily});
  S.cfg={};cfg.forEach(c=>S.cfg[c.k]=c.v);
  if(!S.kids.find(k=>k.id===S.sel))S.sel=S.kids[0]?.id;
  render();
}
const me=()=>S.kids.find(k=>k.id===S.sel)||{};
const myBal=()=>S.bal.find(b=>b.child_id===S.sel)||{balance:0,won:0,week_earned:0,week_spent:0};
const catOf=n=>S.cats.find(c=>c.name===n)||{emoji:"🏷️",weight:1};
const isParent=()=>!!S.pin;

/* ---------- 상단 ---------- */
function renderKids(){
  $("#kids").innerHTML=S.kids.map(k=>{const b=S.bal.find(x=>x.child_id===k.id)||{balance:0};
    return `<button class="kidcard ${k.id===S.sel?"on":""}" style="--accent:${k.color}" onclick="pick(${k.id})">
      <div class="nm">${k.emoji} ${esc(k.name)}</div>
      <div class="pt" style="color:${b.balance<0?"var(--minus)":"var(--ink)"}">${b.balance}<small style="font-size:13px;font-weight:700"> 점</small></div>
      <div class="won">${won(b.balance)}</div></button>`}).join("");
  $("#modeBtn").textContent=isParent()?"🔐 부모 모드":"👀 아이 모드";
  $("#modeBtn").className="btn"+(isParent()?" gold":"");
}
function renderTabs(){
  const t=[["today","오늘"],["history","내역"],["goals","목표"],["rules","규칙표"],["report","리포트"]];
  if(isParent())t.push(["admin","관리"]);
  $("#tabs").innerHTML=t.map(([k,l])=>{
    let n="";
    if(k==="today"){const c=pending().length;if(c&&isParent())n=` <b style="color:var(--gold)">${c}</b>`}
    return `<button class="tab ${S.tab===k?"on":""}" onclick="go('${k}')">${l}${n}</button>`}).join("");
}
function pick(id){S.sel=id;render()}
function go(t){S.tab=t;render()}
function render(){renderKids();renderTabs();$("#view").innerHTML=({today:vToday,history:vHistory,goals:vGoals,rules:vRules,report:vReport,admin:vAdmin}[S.tab]||vToday)();}

/* ---------- 오늘 ---------- */
const myTodos=d=>S.todos.filter(t=>t.child_id===S.sel&&t.todo_date===(d||todayKST()));
const pending=()=>[...S.todos.filter(t=>t.status==="done"),...S.reqs.filter(r=>r.status==="pending")];
function vToday(){
  const b=myBal(),ts=myTodos(),k=me();
  const done=ts.filter(t=>t.status!=="open"&&t.status!=="rejected").length;
  const total=ts.reduce((a,t)=>a+(t.status==="approved"?t.points:0),0);
  const poss=ts.reduce((a,t)=>a+t.points,0);
  const myReqs=S.reqs.filter(r=>r.child_id===S.sel&&r.status==="pending");
  return `
  <div class="card" style="text-align:center">
    <div class="sub" style="margin:0">${k.emoji} ${esc(k.name)}의 지금 잔액</div>
    <div class="big" style="color:${b.balance<0?"var(--minus)":"var(--ink)"}">${b.balance}<span style="font-size:20px;font-weight:800"> 점</span></div>
    <div style="font-size:15px;font-weight:800;color:var(--gold)">${won(b.balance)}</div>
    <div class="divider"></div>
    <div class="grid2" style="text-align:left">
      <div><div class="sub" style="margin:0">최근 7일 받은 점수</div><b class="plus" style="font-size:19px">+${b.week_earned}</b></div>
      <div><div class="sub" style="margin:0">최근 7일 쓴 점수</div><b class="minus" style="font-size:19px">-${b.week_spent}</b></div>
    </div>
  </div>

  <div class="card">
    <h3>📋 오늘의 할 일</h3>
    <div class="sub">다 하면 체크! 부모님이 확인하면 점수가 들어와요. (오늘 ${done}/${ts.length}개 · 최대 +${poss}점 · 받은 점수 +${total}점)</div>
    ${ts.length?ts.map(t=>{
      const on=t.status!=="open";
      const badge=t.status==="done"?'<span class="badge wait">확인 기다리는 중</span>'
        :t.status==="approved"?'<span class="badge ok">+'+t.points+'점 받음</span>'
        :t.status==="rejected"?'<span class="badge no">다시 하기</span>':'';
      return `<div class="row">
        <button class="check ${t.status==="approved"?"on":t.status==="done"?"on":""}" style="${t.status==="done"?"background:var(--gold);border-color:var(--gold)":""}"
          onclick="toggleTodo(${t.id},'${t.status}')">${on?"✓":""}</button>
        <div class="t"><b style="${t.status==="approved"?"opacity:.55;text-decoration:line-through":""}">${esc(t.label)}</b><small>+${t.points}점 · ${won(t.points)}</small></div>
        ${badge}
        ${isParent()&&t.status==="done"?`<button class="btn sm gold" onclick="decideTodo(${t.id},true)">승인</button>
          <button class="btn sm ghost" onclick="decideTodo(${t.id},false)">반려</button>`:""}
        ${isParent()&&t.status==="open"?`<button class="btn sm ghost" onclick="delTodo(${t.id})">✕</button>`:""}
      </div>`}).join(""):'<div class="empty">오늘 할 일이 아직 없어요</div>'}
    ${isParent()?`<div class="divider"></div><button class="btn solid" style="width:100%" onclick="sheetTodo()">＋ 오늘 할 일 추가</button>`:""}
  </div>

  <div class="card">
    <h3>✋ 내가 신청하기</h3>
    <div class="sub">잘한 일을 스스로 신청하거나, 사고 싶은 걸 신청해요. 부모님이 확인하면 반영돼요.</div>
    <div class="grid2">
      <button class="btn solid" onclick="sheetReq('earn')">＋ 점수 신청</button>
      <button class="btn ghost" onclick="sheetReq('spend')">🛒 사고 싶어요</button>
    </div>
    ${myReqs.length?'<div class="divider"></div>'+myReqs.map(r=>`<div class="row">
      <div class="t"><b>${r.kind==="spend"?"🛒":"⭐"} ${esc(r.label)}</b>
        <small>${r.kind==="spend"?"-"+Math.round(r.raw_points*catOf(r.category).weight)+"점 예정 · "+esc(r.category||""):"+"+r.raw_points+"점 신청"}</small></div>

async function toggleTodo(id,st){

function goalNeed(g){return Math.round(g.price_won/(S.cfg.won_per_point||100)*catOf(g.category).weight)}

  const gs=S.goals.filter(g=>g.child_id===S.sel&&g.status!=="canceled"),b=myBal().balance;
  const d=S.daily.filter(x=>x.child_id===S.sel),avg=d.length?Math.max(1,Math.round(d.reduce((a,x)=>a+(x.earned||0),0)/Math.max(d.length,7))):0;

    ${gs.length?gs.map(g=>{const need=goalNeed(g),pct=Math.max(0,Math.min(100,Math.round(b/need*100))),left=Math.max(0,need-b);

        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="kv"><span>${pct}% · 필요 ${need}점 (가중치 ${catOf(g.category).weight}배)</span>
          <b class="${left?"":"plus"}">${left?`${left}점 더`:"달성! 🎉"}</b></div>
        ${left&&days?`<div class="hint">지금처럼 하면 약 ${days}일 뒤에 살 수 있어요 (하루 평균 +${avg}점)</div>`:""}
        ${isParent()?`<div style="margin-top:8px" class="grid2">
          <button class="btn sm gold" onclick="buyGoal(${g.id})">지금 구매 처리</button>

    ${S.cats.filter(c=>c.name!=="이전기록").map(c=>`<div class="kv"><span>${c.emoji} ${esc(c.name)}</span><b>${c.weight}배 <small style="color:var(--muted);font-weight:600">· 1,000원짜리 = ${Math.round(10*c.weight)}점</small></b></div>`).join("")}

function vReport(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()+9*3600e3-((6-i)*86400e3));return d.toISOString().slice(0,10)});
  const d=S.daily.filter(x=>x.child_id===S.sel);
  const get=dt=>d.find(x=>x.occurred_on===dt)||{earned:0,spent:0};
  const max=Math.max(10,...days.map(dt=>Math.max(get(dt).earned||0,get(dt).spent||0)));
  const list=S.entries.filter(e=>e.child_id===S.sel);
  const top=Object.entries(list.filter(e=>e.points>0).reduce((a,e)=>(a[e.label]=(a[e.label]||0)+e.points,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const spent=Object.entries(list.filter(e=>e.points<0).reduce((a,e)=>(a[e.label]=(a[e.label]||0)-e.points,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const b=myBal(),rate=b.week_earned?Math.round((b.week_earned-b.week_spent)/b.week_earned*100):0;
  return `
  <div class="card">
    <h3>📈 최근 7일</h3>
    <div class="sub">위(초록)는 받은 점수, 아래(빨강)는 쓴 점수예요.</div>
    <div class="gbars">${days.map(dt=>{const g=get(dt);
      return `<div class="col"><div class="p" style="height:${(g.earned||0)/max*55}%"></div><div class="m" style="height:${(g.spent||0)/max*45}%"></div></div>`}).join("")}</div>
    <div class="glabels">${days.map(dt=>`<div>${+dt.slice(8)}일</div>`).join("")}</div>
    <div class="divider"></div>
    <div class="kv"><span>이번 주 모은 비율 (저축률)</span><b class="${rate>=0?"plus":"minus"}">${rate}%</b></div>
    <div class="hint">저축률 = (받은 점수 − 쓴 점수) ÷ 받은 점수. 50%가 넘으면 잘 모으고 있는 거예요.</div>
  </div>
  <div class="card">
    <h3>🏅 점수를 많이 받은 일</h3>
    <div class="sub">내가 잘하고 있는 습관이에요.</div>
    ${top.length?top.map(([l,p])=>`<div class="row"><div class="t"><b>${esc(l)}</b></div><div class="amt plus">+${p}</div></div>`).join(""):'<div class="empty">아직 없어요</div>'}
  </div>
  <div class="card">
    <h3>💸 점수를 많이 쓴 곳</h3>
    <div class="sub">여기에 뭐가 자주 보이는지 같이 이야기해 보세요.</div>
    ${spent.length?spent.map(([l,p])=>`<div class="row"><div class="t"><b>${esc(l)}</b></div><div class="amt minus">-${p}</div></div>`).join(""):'<div class="empty">아직 없어요</div>'}
  </div>`;
}

  ${kind==="earn"?`<label class="f">점수 (빼려면 -10 처럼 음수)</label><input id="ep" type="number" inputmode="numeric" value="10">`
  :`<label class="f">금액 (원)</label><input id="ew" type="number" inputmode="numeric" placeholder="3000" oninput="calcEnt()">
    <label class="f">카테고리</label><select id="ecat" onchange="calcEnt()">${S.cats.filter(c=>c.name!=="이전기록").map(c=>`<option value="${esc(c.name)}" ${c.name==="일반"?"selected":""}>${c.emoji} ${esc(c.name)} (×${c.weight})</option>`).join("")}</select>
    <div class="calc" id="ecalc">금액을 입력하세요</div>`}
  <label class="f">날짜</label><input id="ed" type="date" value="${todayKST()}">
  <button class="btn solid" style="width:100%;margin-top:12px" onclick="saveEntry('${kind}')">저장</button>`)}
function calcEnt(){const w=+($("#ew")?.value||0),g=catOf($("#ecat")?.value);
  const pts=Math.round(w/(S.cfg.won_per_point||100)),real=Math.round(pts*g.weight);
  $("#ecalc").innerHTML=w?`${w.toLocaleString("ko-KR")}원 = ${pts}점 × ${g.weight}배 → <b class="minus">-${real}점</b>`:"금액을 입력하세요"}
async function saveEntry(kind){const l=$("#el").value.trim();if(!l)return toast("내용을 써주세요");
  const body={child_id:+$("#ec").value,label:l,occurred_on:$("#ed").value};
  if(kind==="earn"){const p=+$("#ep").value;Object.assign(body,{kind:p>=0?"earn":"adjust",raw_points:p,category:"직접 지급"})}
  else Object.assign(body,{kind:"spend",raw_points:Math.round(+$("#ew").value/(S.cfg.won_per_point||100)),category:$("#ecat").value});
  await admin("add_entry",body);closeSheet();toast("저장했어요");await load()}

function sheetGoal(){openSheet(`<h3 style="margin-top:0">목표 추가</h3>
  <label class="f">누구의 목표</label><select id="gc">${S.kids.map(k=>`<option value="${k.id}" ${k.id===S.sel?"selected":""}>${k.emoji} ${esc(k.name)}</option>`).join("")}</select>
  <label class="f">갖고 싶은 것</label><input id="gt" placeholder="예: 닌텐도 게임">
  <label class="f">가격 (원)</label><input id="gp" type="number" inputmode="numeric" placeholder="50000">
  <label class="f">카테고리</label><select id="gcat">${S.cats.filter(c=>c.name!=="이전기록").map(c=>`<option value="${esc(c.name)}" ${c.name==="일반"?"selected":""}>${c.emoji} ${esc(c.name)} (×${c.weight})</option>`).join("")}</select>
  <button class="btn solid" style="width:100%;margin-top:12px" onclick="saveGoal()">추가</button>`)}
async function saveGoal(){const t=$("#gt").value.trim();if(!t)return toast("이름을 써주세요");
  await admin("upsert_goal",{child_id:+$("#gc").value,title:t,price_won:+$("#gp").value,category:$("#gcat").value});
  closeSheet();await load()}

function sheetRule(){openSheet(`<h3 style="margin-top:0">규칙 추가</h3>
  <label class="f">내용</label><input id="ul" placeholder="예: 동생 도와주기">
  <div class="grid2"><div><label class="f">점수</label><input id="up" type="number" value="10"></div>
  <div><label class="f">묶음</label><input id="ug" value="생활"></div></div>
  <button class="btn solid" style="width:100%;margin-top:12px" onclick="saveRule()">추가</button>`)}
async function saveRule(){const l=$("#ul").value.trim();if(!l)return toast("내용을 써주세요");
  await admin("upsert_rule",{label:l,points:+$("#up").value,group_name:$("#ug").value||"기본"});closeSheet();await load()}

function sheetCat(){openSheet(`<h3 style="margin-top:0">쓸 때의 가중치</h3>
  <div class="hint" style="margin:0 0 10px">1.2배면 20% 더 비싸게, 0.5배면 반값으로 사는 셈이에요.</div>
  ${S.cats.filter(c=>c.name!=="이전기록").map(c=>`<div class="row"><div class="t"><b>${c.emoji} ${esc(c.name)}</b><small>${esc(c.hint||"")}</small></div>
    <input style="width:78px" type="number" step="0.1" value="${c.weight}" onchange="saveCat('${esc(c.name)}',this.value)"></div>`).join("")}`)}
async function saveCat(name,w){const c=catOf(name);await admin("upsert_category",{name,weight:+w,emoji:c.emoji,hint:c.hint,sort:c.sort});toast("바꿨어요");await load()}

function sheetPin(){openSheet(`<h3 style="margin-top:0">PIN 변경</h3>
  <label class="f">새 PIN (숫자 4자리 이상)</label><input id="np" type="text" inputmode="numeric" placeholder="새 PIN">
  <button class="btn solid" style="width:100%;margin-top:12px" onclick="savePin()">변경</button>`)}
async function savePin(){const p=$("#np").value.trim();if(p.length<4)return toast("4자리 이상으로 해주세요");
  await admin("set_pin",{pin:p});S.pin=p;localStorage.setItem("kp_pin",p);closeSheet();toast("PIN을 바꿨어요")}

function sheetWon(){openSheet(`<h3 style="margin-top:0">1점의 가치</h3>
  <label class="f">원</label><input id="wv" type="number" value="${S.cfg.won_per_point||100}">
  <button class="btn solid" style="width:100%;margin-top:12px" onclick="saveWon()">저장</button>`)}
async function saveWon(){await admin("set_config",{k:"won_per_point",v:+$("#wv").value});closeSheet();await load()}

/* ---------- 모드 ---------- */
$("#modeBtn").onclick=async()=>{
  if(isParent()){S.pin=null;localStorage.removeItem("kp_pin");if(S.tab==="admin")S.tab="today";toast("아이 모드로 바꿨어요");render();return}
  const p=prompt("부모 PIN을 입력하세요");if(!p)return;
  const r=await rpc("kp_admin",{p_pin:p,p_op:"set_config",p_payload:{k:"_ping",v:1}});
  if(r&&r.ok){S.pin=p;localStorage.setItem("kp_pin",p);toast("부모 모드 🔐");render()}else toast("PIN이 맞지 않아요")};
S.pin=localStorage.getItem("kp_pin");
load().catch(e=>{$("#view").innerHTML='<div class="card"><h3>연결에 문제가 있어요</h3><div class="sub">'+esc(e&&e.message?e.message:String(e))+'</div><button class="btn solid" style="width:100%" onclick="location.reload()">다시 시도</button></div>';console.error(e)});
setInterval(()=>load().catch(()=>{}),60000);
</script>
</body>
</html>
