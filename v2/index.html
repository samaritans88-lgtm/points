<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFB703">
<title>포인트 통장</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포인트통장">
<style>
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#151823; --muted:#6B7280; --line:#E6E9F0;
  --plus:#0E9F6E; --minus:#E5484D; --gold:#FFB703; --chip:#F1F3F9;
  --shadow:0 2px 10px rgba(20,25,50,.06); --r:18px; --accent:#4F7CFF;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1117; --card:#181B23; --ink:#E9ECF3; --muted:#9AA3B2; --line:#262B36;
  --plus:#3DD68C; --minus:#FF6B6E; --chip:#212632; --shadow:0 2px 12px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
body{padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 8px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{background:var(--chip);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--card)}
.btn.gold{background:var(--gold);color:#1a1200}
.btn.ghost{border:1px solid var(--line);background:transparent}
.btn.danger{background:transparent;border:1px solid var(--minus);color:var(--minus)}
.btn.sm{padding:6px 11px;font-size:12px}
.grid2 .btn{white-space:normal}
.btn.wide{width:100%;margin-top:8px;padding:12px 14px;font-size:14px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 12px}
.kidcard{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border:2px solid transparent;text-align:left}
.kidcard.on{border-color:var(--accent)}
.kidcard .nm{font-size:13px;color:var(--muted);font-weight:700}
.kidcard .pt{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:4px}
.kidcard .won{font-size:12px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--card)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:-.2px}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.big{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1.05}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{font-size:11px;color:var(--muted)}
.amt{font-weight:800;font-size:15px;white-space:nowrap}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.wait{background:#FFF3D6;color:#9A6B00}
.badge.ok{background:#DFF5EA;color:#0B7A53}
.badge.no{background:#FDE5E6;color:#B4262A}
@media (prefers-color-scheme:dark){.badge.wait{background:#3A2E10;color:#FFD98A}.badge.ok{background:#12352A;color:#7BE3B6}.badge.no{background:#3B1D1F;color:#FF9FA1}}
.check{width:27px;height:27px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;background:transparent}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
label.f{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin:10px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--chip);border-radius:11px;padding:8px 11px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.dow{display:flex;gap:5px;margin-top:4px}
.dow button{flex:1;padding:9px 0;border-radius:10px;background:var(--chip);font-size:12px;font-weight:800;color:var(--muted)}
.dow button.on{background:var(--accent);color:#fff}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9A3C)}
.bar.g>i{background:linear-gradient(90deg,var(--plus),#6EE7B7)}
.slot{font-size:11.5px;font-weight:800;color:var(--muted);margin:14px 0 2px}
.gbars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-top:8px}
.gbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.gbars .p{background:var(--plus);border-radius:4px 4px 0 0;min-height:2px}
.glabels{display:flex;gap:5px;margin-top:6px}
.glabels div{flex:1;text-align:center;font-size:9.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0;line-height:1.6}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.hint{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:8px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.divider{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0}
.kv span{color:var(--muted)}
.kv b{font-weight:800;text-align:right}
.streak{display:inline-flex;align-items:center;gap:5px;background:#FFF3D6;color:#9A6B00;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.hero{padding:48px 4px 20px;text-align:center}
.hero .logo{font-size:56px}
.hero h1{font-size:24px;letter-spacing:-.6px;margin:8px 0 6px}
.hero p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:auto;transform:scale(1.4)}
.code{font-size:34px;font-weight:900;letter-spacing:4px;text-align:center;font-family:ui-monospace,Menlo,monospace;margin:8px 0}
.qr{display:flex;justify-content:center;margin:10px 0}
.qr canvas,.qr img{background:#fff;padding:8px;border-radius:12px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.kidform{background:var(--chip);border-radius:14px;padding:10px 12px;margin-top:8px}
.canceled{opacity:.45;text-decoration:line-through}
.wmode header,.wmode .kids,.wmode .tabs{display:none}
.wmode .wrap{padding:0;max-width:none}
.wcard{min-height:100vh;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" style="display:none">
    <div class="brand" id="brand">🪙 포인트 통장</div>
    <span style="display:flex;gap:6px;align-items:center">
      <button class="btn" id="bell" title="알림 설정">🔕</button>
      <button class="btn" id="whoBtn"></button>
    </span>
  </header>
  <div class="kids" id="kids"></div>
  <div class="tabs" id="tabs"></div>
  <main id="view"><div class="empty">🪙<br>불러오는 중…</div></main>
</div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
const CFG = window.KP_CONFIG || {};
const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});
const SLOTS = [["아침","🌅"],["낮","☀️"],["저녁","🌙"]];
const DOW = ["월","화","수","목","금","토","일"];
const EMOJIS = ["🦊","🐰","🐻","🐼","🐯","🦁","🐨","🐸","🐧","🦄","🐶","🐱"];
const COLORS = ["#4F7CFF","#FF7A59","#0E9F6E","#B15CFF","#FFB703","#E5484D","#14B8A6","#64748B"];
const WIDGET = /[?&]widget=1/.test(location.search);
const S = { me:null, fam:null, kids:[], bal:[], cats:[], rules:[], routines:[], entries:[], todos:[], reqs:[], goals:[],
            devices:[], members:[], teams:[], contribs:[], badges:[], prog:{}, sel:null, tab:"today", draft:null };
// 배지 목록 (서버 award_badges 와 코드 일치)
const BADGES = [
  ["first_todo","🌱","첫 걸음","처음으로 할 일을 해내기"],
  ["streak_3","🔥","3일 연속","할 일을 3일 연속 전부 해내기"],
  ["streak_7","🔥","일주일 연속","7일 연속 전부 해내기"],
  ["streak_14","🔥","2주 연속","14일 연속 전부 해내기"],
  ["streak_30","🏆","한 달 연속","30일 연속 전부 해내기"],
  ["streak_100","👑","100일 연속","100일 연속 전부 해내기"],
  ["earned_100","🪙","누적 100점","지금까지 받은 점수 100점"],
  ["earned_500","💰","누적 500점","지금까지 받은 점수 500점"],
  ["earned_1000","💎","누적 1,000점","지금까지 받은 점수 1,000점"],
  ["earned_5000","🚀","누적 5,000점","지금까지 받은 점수 5,000점"],
  ["save_300","🐷","300점 모으기","잔액 300점 만들기"],
  ["save_1000","🏦","1,000점 모으기","잔액 1,000점 만들기"],
  ["self_request","✋","스스로 신청","잘한 일을 스스로 신청해서 인정받기"],
  ["goal_done","🎯","목표 달성","목표 통장의 물건 사기"],
  ["smart_buy","📚","똑똑한 소비","책·체험처럼 할인되는 카테고리로 사기"],
  ["interest_first","🌳","첫 이자","모아둔 점수로 이자 받기"],
  ["team_done","🤝","함께 해냄","형제와 공동 목표 달성"],
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isParent = () => S.me && S.me.state === "parent";
const isDevice = () => S.me && S.me.state === "device";
const tz = () => (S.fam && S.fam.timezone) || "Asia/Seoul";
const todayStr = () => new Intl.DateTimeFormat("en-CA", { timeZone: tz() }).format(new Date());
const dayAgo = n => { const d = new Date(todayStr() + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0,10); };
const won = p => (p * ((S.fam && S.fam.won_per_point) || 100)).toLocaleString("ko-KR") + "원";

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2200); }
const ERR = { not_parent:"부모만 할 수 있어요", no_access:"권한이 없어요", login_required:"로그인이 필요해요",
  already_in_family:"이미 가족에 속해 있어요", no_family:"가족 정보가 없어요" };
function errMsg(e){ const m = (e && (e.message || e.error_description)) || String(e); for (const k in ERR) if (m.includes(k)) return ERR[k]; return m; }

// RPC 호출: 실패하면 토스트 후 null
async function call(fn, args){
  const { data, error } = await sb.rpc(fn, args || {});
  if (error) { toast(errMsg(error)); return null; }
  if (data && data.ok === false) { toast(data.error || "실패했어요"); return null; }
  return data || { ok:true };
}
async function sel(q){ const { data, error } = await q; if (error) throw error; return data || []; }

/* ================= 부팅 ================= */
async function boot(){
  if (!CFG.SUPABASE_URL) { $("#view").innerHTML = '<div class="card"><h3>설정이 필요해요</h3><div class="sub">config.js 에 Supabase 주소와 키를 넣어 주세요.</div></div>'; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) return vLanding();
  S.uid = data.session.user.id;
  const { data: me, error } = await sb.rpc("whoami");
  if (error) { $("#view").innerHTML = errorCard(error); return; }
  S.me = me;
  if (me.state === "parent" || me.state === "device") {
    if (me.state === "device") sb.rpc("touch_device");
    await load(true);
    setInterval(() => load().catch(() => {}), 60000);
    initPush();
    return;
  }
  if (me.state === "revoked") return vRevoked();
  if (me.state === "new") return me.anonymous ? vPair() : vOnboard();
  vLanding();
}
function errorCard(e){
  return `<div class="card"><h3>연결에 문제가 있어요</h3><div class="sub">${esc(errMsg(e))}</div>
    <button class="btn solid wide" onclick="location.reload()">다시 시도</button></div>`;
}

async function load(first){
  if (first) await sb.rpc("ensure_today");
  const since = dayAgo(60);
  const qs = [
    sel(sb.from("family").select("*").limit(1)),
    sel(sb.from("child").select("*").is("archived_at", null).order("sort")),
    sel(sb.rpc("balances")),
    sel(sb.from("category").select("*").order("sort")),
    sel(sb.from("rule").select("*").eq("active", true).order("sort")),
    sel(sb.from("routine").select("*").order("sort")),
    sel(sb.from("entry").select("*").order("occurred_on", { ascending:false }).order("created_at", { ascending:false }).limit(1000)),
    sel(sb.from("todo").select("*").gte("todo_date", since).order("todo_date", { ascending:false }).order("created_at")),
    sel(sb.from("request").select("*").order("created_at", { ascending:false }).limit(100)),
    sel(sb.from("goal").select("*").neq("status", "canceled").order("created_at", { ascending:false })),
  ];
  qs.push(sel(sb.from("team_goal").select("*").neq("status", "canceled").order("created_at", { ascending:false })));
  qs.push(sel(sb.from("team_contribution").select("*").order("created_at")));
  qs.push(sel(sb.from("badge").select("*").order("earned_at", { ascending:false })));
  if (isParent()) {
    qs.push(sel(sb.from("device").select("*").is("revoked_at", null).order("created_at")));
    qs.push(sel(sb.from("family_member").select("*").order("created_at")));
  }
  const r = await Promise.all(qs);
  const [fam, kids, bal, cats, rules, routines, entries, todos, reqs, goals, teams, contribs, badges, devices, members] = r;
  Object.assign(S, { fam: fam[0], kids, bal, cats, rules, routines, entries, todos, reqs, goals, teams, contribs, badges,
                     devices: devices || [], members: members || [] });
  // 선택 아이: 아이 기기는 자기 아이 고정
  if (isDevice() && S.me.mode === "child") S.sel = S.me.child_id;
  if (!S.kids.find(k => k.id === S.sel)) {
    let saved = null; try { saved = localStorage.getItem("kp2_sel"); } catch(e) {}
    S.sel = (S.kids.find(k => k.id === saved) || S.kids[0] || {}).id;
  }
  await loadProgress();
  render();
}
// 선택된 아이의 연속 기록·습관 진행 (서버 계산)
async function loadProgress(){
  if (!S.sel) return;
  const { data } = await sb.rpc("child_progress", { p_child:S.sel });
  if (data) S.prog[S.sel] = data;
}

/* ================= 가입 전 화면 ================= */
function showChrome(on){ $("#hdr").style.display = on ? "flex" : "none"; if (!on) { $("#kids").innerHTML = ""; $("#tabs").innerHTML = ""; } }

function vLanding(){
  showChrome(false);
  const code = new URLSearchParams(location.search).get("code");
  $("#view").innerHTML = `
  <div class="hero"><div class="logo">🪙</div><h1>우리집 포인트 통장</h1>
    <p>할 일을 하면 점수, 쓰면 가중치만큼 차감.<br>아이와 함께 쓰는 용돈 관리 앱이에요.</p></div>
  <div class="card">
    <h3>👨‍👩‍👧 부모님</h3><div class="sub">Google 계정으로 시작해요. 배우자 초대 코드를 받았어도 여기로 로그인하세요.</div>
    <button class="btn solid wide" onclick="googleLogin()">Google로 시작하기</button>
  </div>
  <div class="card">
    <h3>📱 아이 폰</h3><div class="sub">부모님 앱에서 받은 <b>8자리 연결 코드</b>로 아이 폰을 연결해요. 아이는 가입이 필요 없어요.</div>
    <button class="btn gold wide" onclick="startPair()">아이 폰으로 연결하기</button>
  </div>
  <div class="hint" style="text-align:center"><a href="./privacy.html">개인정보처리방침</a></div>`;
  if (code) startPair();
}
async function googleLogin(){
  const { error } = await sb.auth.signInWithOAuth({ provider:"google",
    options: { redirectTo: location.origin + location.pathname } });
  if (error) toast(errMsg(error));
}
async function startPair(){
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    const { error } = await sb.auth.signInAnonymously();
    if (error) { toast("연결 준비 실패: " + errMsg(error)); return; }
  }
  vPair();
}
function vPair(msg){
  showChrome(false);
  const code = new URLSearchParams(location.search).get("code") || "";
  $("#view").innerHTML = `
  <div class="hero"><div class="logo">📱</div><h1>아이 폰 연결</h1>
    <p>부모님 앱 → 관리 → <b>아이 기기 연결</b>에서<br>나온 코드를 입력하세요. (10분 안에)</p></div>
  <div class="card">
    ${msg ? `<div class="sub" style="color:var(--minus)">${esc(msg)}</div>` : ""}
    <label class="f">연결 코드</label>
    <input id="pc" value="${esc(code)}" placeholder="예: AB3K-9QXZ" autocomplete="off" autocapitalize="characters" style="font-size:22px;letter-spacing:3px;text-align:center">
    <button class="btn solid wide" onclick="doPair()">연결하기</button>
    <div class="hint">이 폰은 연결된 아이 전용이 돼요. 점수를 주거나 승인하는 건 부모님 폰에서만 할 수 있어요.</div>
  </div>
  <button class="btn ghost wide" onclick="resetLogin()">처음으로</button>`;
}
async function doPair(){
  const code = $("#pc").value.trim();
  if (!code) return toast("코드를 입력하세요");

async function createFamily(){

/* ================= 공통 계산 ================= */
const me = () => S.kids.find(k => k.id === S.sel) || {};
const balOf = id => (S.bal.find(b => b.child_id === id) || { balance:0, week_earned:0, week_spent:0 });
const catOf = n => S.cats.find(c => c.name === n) || { emoji:"🏷️", weight:1 };
const todosOf = (cid, d) => S.todos.filter(t => t.child_id === cid && t.todo_date === d);
const canceledIds = () => new Set(S.entries.filter(e => e.kind === "cancel").map(e => e.cancels_entry_id));
const stat = list => { const total = list.reduce((a,t)=>a+t.points,0);
  const got = list.filter(t=>t.status==="approved").reduce((a,t)=>a+t.points,0);
  const wait = list.filter(t=>t.status==="done").reduce((a,t)=>a+t.points,0);
  return { total, got, wait, left:Math.max(0,total-got-wait), pct: total?Math.round(got/total*100):0,
           pctw: total?Math.round((got+wait)/total*100):0, doneN:list.filter(t=>t.status==="approved").length, n:list.length }; };
function streakOf(cid){ let s=0;
  for (let i=1;i<=60;i++){ const l=todosOf(cid,dayAgo(i)); if(!l.length||!l.every(t=>t.status==="approved")) break; s++; }
  const t=stat(todosOf(cid,todayStr())); if(t.n&&t.doneN===t.n) s++; return s; }
// 이 기기가 조작할 수 있는 아이인가 (형제 보기로 '보이기만' 하는 아이 제외)
const canAct = cid => isParent() || (isDevice() && (S.me.mode === "shared" || S.me.child_id === cid));
const visibleKids = () => S.kids.filter(k => S.bal.some(b => b.child_id === k.id));

function todoRow(t){
  const act = canAct(t.child_id);
  const badge = t.status==="done" ? '<span class="badge wait">확인 중</span>'
    : t.status==="approved" ? `<span class="badge ok">+${t.points}점</span>`
    : t.status==="rejected" ? '<span class="badge no">다시</span>' : "";
  const style = t.status==="approved" ? "background:var(--plus);border-color:var(--plus);color:#fff"
    : t.status==="done" ? "background:var(--gold);border-color:var(--gold);color:#fff" : "";
  return `<div class="row">
    <button class="check" style="${style}" ${act?`onclick="toggleTodo('${t.id}','${t.status}')"`:"disabled"}>${t.status==="approved"||t.status==="done"?"✓":""}</button>
    <div class="t"><b style="${t.status==="approved"?"opacity:.5;text-decoration:line-through":""}">${esc(t.label)}</b>
      <small>+${t.points}점 · ${won(t.points)}</small></div>
    ${badge}
    ${isParent()&&t.status==="done"?`<button class="btn sm gold" onclick="decideTodo('${t.id}',true)">승인</button><button class="btn sm ghost" onclick="decideTodo('${t.id}',false)">반려</button>`:""}
    ${isParent()&&t.status!=="done"&&t.status!=="approved"?`<button class="btn sm ghost" onclick="delTodo('${t.id}')">✕</button>`:""}
  </div>`;
}

  <div class="card">
    <h3>🎯 오늘의 달성률 ${sk?`<span class="streak" style="float:right">🔥 ${sk}일 연속</span>`:""}</h3>
    ${st.n?`
    <div style="display:flex;align-items:baseline;gap:8px;margin:10px 0 8px">
      <div style="font-size:38px;font-weight:900;letter-spacing:-1.5px;color:${st.pct>=100?"var(--plus)":"var(--ink)"}">${st.pct}<span style="font-size:18px">%</span></div>
      <div style="font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.45">

        ${st.left?`<b style="color:var(--gold)">${st.left}점</b> 더 받을 수 있어요 (${won(st.left)})`:"<b class='plus'>오늘 할 일 전부 끝! 🎉</b>"}
      </div>

async function toggleTodo(id, st){
  if (st === "approved") return toast("이미 점수를 받았어요");
  if (st === "done") { await call("check_todo", { p_todo:id, p_done:false }); }
  else if (await call("check_todo", { p_todo:id, p_done:true })) toast(isParent() ? "체크했어요" : "체크! 부모님 확인을 기다려요 ⏳");
  await load();
}
async function decideTodo(id, ok){ if (await call("decide_todo", { p_todo:id, p_approve:ok })) toast(ok ? "점수 지급 🎉" : "반려했어요"); await load(); }
async function delTodo(id){ if (confirm("이 할 일을 지울까요? (루틴 자체는 남아요)")) { await call("delete_todo", { p_todo:id }); await load(); } }
async function carry(id){ if (await call("carry_todo", { p_todo:id })) toast("오늘로 옮겼어요"); await load(); }
async function decideReq(id, ok){ if (await call("decide_request", { p_request:id, p_approve:ok })) toast(ok ? "승인했어요" : "거절했어요"); await load(); }
async function cancelReq(id){ await call("cancel_request", { p_request:id }); await load(); }

/* ---------- 내역 ---------- */
function vHistory(){
  const cx = canceledIds();
  const list = S.entries.filter(e => e.child_id === S.sel);
  const grp = {}; list.forEach(e => (grp[e.occurred_on] = grp[e.occurred_on] || []).push(e));
  const dates = Object.keys(grp).sort().reverse();
  const row = e => { const dead = cx.has(e.id);
    return `<div class="row ${dead?"canceled":""}">
      <div class="t"><b>${e.kind==="cancel"?"↩️":e.kind==="interest"?"🌳":e.kind==="team"?"🤝":esc(catOf(e.category).emoji)} ${esc(e.label)}</b>
        <small>${e.kind==="spend"?`${e.raw_points}점 × ${(+e.weight).toFixed(1)}배 ${esc(e.category||"")}`:e.kind==="cancel"?"취소 기록"+(e.memo?" · "+esc(e.memo):""):esc(e.category||"받은 점수")}${dead?" · 취소됨":""}</small></div>
      <div class="amt ${e.points>=0?"plus":"minus"}">${e.points>0?"+":""}${e.points}</div>
      ${isParent()&&!dead&&e.kind!=="cancel"?`<button class="btn sm ghost" onclick="cancelEntry('${e.id}')">취소</button>`:""}
    </div>`; };
  return dates.length ? dates.map(d => { const day = grp[d], net = day.reduce((a,e)=>a+e.points,0);
    return `<div class="card"><h3>${d===todayStr()?"오늘":d===dayAgo(1)?"어제":d} <span style="float:right;font-size:13px" class="${net>=0?"plus":"minus"}">${net>0?"+":""}${net}점</span></h3>
      ${day.map(row).join("")}</div>`; }).join("")
    : '<div class="card"><div class="empty">아직 기록이 없어요</div></div>';
}
async function cancelEntry(id){
  const e = S.entries.find(x => x.id === id); if (!e) return;
  const reason = prompt(`'${e.label}' (${e.points>0?"+":""}${e.points}점) 기록을 취소할까요?\n원본은 남고 '취소 기록'이 추가돼요.\n\n취소 이유 (선택):`, "");
  if (reason === null) return;
  if (await call("cancel_entry", { p_entry:id, p_reason:reason || null })) toast("취소 기록을 남겼어요");
  await load();
}

/* ---------- 목표 ---------- */
function goalNeed(g){ return Math.round(g.price_won / ((S.fam && S.fam.won_per_point) || 100) * catOf(g.category).weight); }
function vGoals(){
  const gs = S.goals.filter(g => g.child_id === S.sel), b = balOf(S.sel).balance, st = stat(todosOf(S.sel, todayStr()));
  return vTeam() + `<div class="card"><h3>🏦 목표 통장</h3>
    <div class="sub">갖고 싶은 걸 걸어두면 지금 잔액으로 얼마나 왔는지 보여줘요. 카테고리 가중치가 적용돼요.</div>
    ${gs.length?gs.map(g=>{ const need=goalNeed(g), pct=Math.max(0,Math.min(100,Math.round(b/need*100))), left=Math.max(0,need-b);
      const days = st.total ? Math.ceil(left/Math.max(1,Math.round(st.total*0.7))) : null;
      return `<div style="margin-bottom:16px">
        <div class="kv"><b>${esc(catOf(g.category).emoji)} ${esc(g.title)}${g.status==="done"?" ✅":""}</b><span>${g.price_won.toLocaleString("ko-KR")}원</span></div>
        <div class="bar"><i style="width:${g.status==="done"?100:pct}%"></i></div>
        <div class="kv"><span>${pct}% · 필요 ${need}점 (${(+catOf(g.category).weight).toFixed(1)}배)</span><b class="${left?"":"plus"}">${g.status==="done"?"샀어요!":left?left+"점 더":"달성! 🎉"}</b></div>
        ${g.status!=="done"&&left&&days?`<div class="hint">오늘 루틴(하루 ${st.total}점)을 70%씩 해내면 약 ${days}일 뒤에 살 수 있어요.</div>`:""}
        ${isParent()&&g.status!=="done"?`<div style="margin-top:8px" class="grid2"><button class="btn sm gold" onclick="buyGoal('${g.id}')">구매 처리</button>
          <button class="btn sm ghost" onclick="delGoal('${g.id}')">삭제</button></div>`:""}
      </div>`; }).join(""):'<div class="empty">아직 목표가 없어요</div>'}
    ${isParent()?`<button class="btn solid wide" onclick="sheetGoal()">＋ 목표 추가</button>`
      :canAct(S.sel)?`<button class="btn ghost wide" onclick="sheetReq('spend')">사고 싶은 것 신청하기</button>`:""}
  </div>
  <div class="card"><h3>💡 기다리면 이득</h3><div class="sub">필요한 물건(책·체험)은 같은 돈으로 더 많이 살 수 있어요.</div>
    ${S.cats.map(c=>`<div class="kv"><span>${esc(c.emoji)} ${esc(c.name)}</span><b>${(+c.weight).toFixed(1)}배 <small style="color:var(--muted);font-weight:600">· 1,000원 = ${Math.round(1000/((S.fam&&S.fam.won_per_point)||100)*c.weight)}점</small></b></div>`).join("")}
  </div>`;
}
async function buyGoal(id){ const g = S.goals.find(x => x.id === id);
  if (!confirm(`${g.title} 구매로 ${goalNeed(g)}점을 뺄까요?`)) return;
  const r = await call("add_entry", { p: { child_id:g.child_id, kind:"spend", label:g.title,
    raw_points: Math.round(g.price_won / ((S.fam && S.fam.won_per_point) || 100)), category:g.category } });
  if (r) await call("upsert_goal", { p: { id, title:g.title, price_won:g.price_won, category:g.category, status:"done" } });
  toast("구매 처리했어요"); await load(); }
async function delGoal(id){ if (confirm("이 목표를 지울까요?")) { await call("delete_goal", { p_goal:id }); await load(); } }

/* ---------- 공동 목표 ---------- */
function teamProgress(gid){ const cx = canceledIds();
  return S.contribs.filter(c => c.goal_id === gid && !cx.has(c.entry_id)).reduce((a,c) => a + c.points, 0); }
function vTeam(){
  const gs = S.teams.filter(g => g.status === "active" || (g.status === "done" && Date.now() - new Date(g.achieved_at) < 14*86400e3));
  if (!gs.length && !isParent()) return "";
  const cx = canceledIds();
  return `<div class="card"><h3>🤝 형제 공동 목표</h3><div class="sub">각자 자기 점수를 보태서 함께 모아요. 누가 얼마나 보탰는지 다 같이 봐요.</div>
    ${gs.map(g => { const got = teamProgress(g.id), pct = Math.min(100, Math.round(got / g.target_points * 100));
      const by = S.kids.map(k => [k, S.contribs.filter(c => c.goal_id === g.id && c.child_id === k.id && !cx.has(c.entry_id)).reduce((a,c)=>a+c.points,0)]).filter(x => x[1]);
      return `<div style="margin-bottom:14px">
        <div class="kv"><b>${esc(g.emoji)} ${esc(g.title)}${g.status==="done"?" 🎉":""}</b><span>${got} / ${g.target_points}점</span></div>
        <div class="bar g"><i style="width:${pct}%"></i></div>
        <div class="chips" style="margin-top:6px">${by.map(([k,v]) => `<span class="chip">${esc(k.emoji)} ${esc(k.name)} <b>${v}</b></span>`).join("") || '<span class="hint" style="margin:0">아직 아무도 안 보탰어요</span>'}</div>
        ${g.status==="active"&&canAct(S.sel)?`<button class="btn gold wide" onclick="sheetContribute('${g.id}')">${esc(me().name)} 점수 보태기</button>`:""}
        ${g.status==="active"&&isParent()?`<button class="btn ghost wide" onclick="cancelTeam('${g.id}')">취소 (보탠 점수 돌려주기)</button>`:""}
      </div>`; }).join("") || '<div class="empty">진행 중인 공동 목표가 없어요</div>'}
    ${isParent()?`<button class="btn solid wide" onclick="sheetTeam()">＋ 공동 목표 만들기</button>`:""}</div>`;
}
function sheetTeam(){
  openSheet(`<h3 style="margin-top:0">🤝 공동 목표 만들기</h3>
    <div class="hint" style="margin:0 0 6px">예: 가족 외식, 놀이공원, 보드게임. 아이들이 자기 점수를 보태서 함께 채워요.</div>
    <div style="display:flex;gap:8px"><input id="tge" style="width:64px;text-align:center" value="🍕" maxlength="4"><input id="tgt" placeholder="목표 이름" maxlength="60"></div>
    <label class="f">모아야 할 점수</label><input id="tgp" type="number" inputmode="numeric" value="500">
    <button class="btn solid wide" onclick="saveTeam()">만들기</button>`);
}
async function saveTeam(){ const t = $("#tgt").value.trim(), n = +$("#tgp").value;
  if (!t || !(n > 0)) return toast("이름과 점수를 넣어주세요");
  if (!await call("create_team_goal", { p_title:t, p_target:n, p_emoji:$("#tge").value.trim() })) return;
  closeSheet(); toast("공동 목표를 만들었어요"); await load(); }
function sheetContribute(gid){ const g = S.teams.find(x => x.id === gid), left = g.target_points - teamProgress(gid), b = balOf(S.sel).balance;
  openSheet(`<h3 style="margin-top:0">${esc(g.emoji)} ${esc(g.title)}에 보태기</h3>
    <div class="sub">${esc(me().name)}의 잔액 <b>${b}점</b> · 남은 목표 <b>${left}점</b></div>
    <label class="f">보탤 점수</label><input id="ctp" type="number" inputmode="numeric" value="${Math.max(0, Math.min(10, b, left))}">
    <button class="btn gold wide" onclick="doContribute('${gid}')">보태기</button>
    <div class="hint">보탠 점수는 내 잔액에서 빠져요. 목표가 취소되면 돌려받아요.</div>`); }
async function doContribute(gid){ const r = await call("contribute_team", { p_goal:gid, p_child:S.sel, p_points:+$("#ctp").value }); if (!r) return;
  closeSheet(); toast(`${r.points}점 보탰어요 🤝`); await load(); }
async function cancelTeam(gid){ if (!confirm("공동 목표를 취소할까요? 보탠 점수는 각자에게 돌려줘요.")) return;
  if (await call("cancel_team_goal", { p_goal:gid })) toast("취소하고 점수를 돌려줬어요"); await load(); }

/* ---------- 배지 ---------- */
function badgeInfo(b){ if (b.code.startsWith("habit:")) return [b.code, "🎓", "습관 졸업: " + (b.label || ""), "같은 루틴 30번 연속 성공"];
  return BADGES.find(x => x[0] === b.code) || [b.code, "🏅", b.code, ""]; }
function vBadges(){

  const habits = mine.filter(b => b.code.startsWith("habit:"));

  const cell = (emoji, name, desc, on, when) => `<div style="text-align:center;padding:10px 4px;border-radius:14px;background:var(--chip);${on?"":"opacity:.38;filter:grayscale(1)"}">
      <div style="font-size:30px">${emoji}</div><div style="font-size:12px;font-weight:800;margin-top:2px">${esc(name)}</div>
      <div style="font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px">${on&&when?when.slice(0,10):esc(desc)}</div></div>`;
  return `<div class="card"><h3>🏅 ${esc(me().name)}의 배지 (${mine.length}개)</h3><div class="sub">흐린 배지는 아직 못 받은 거예요. 조건을 보고 도전해 보세요!</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${BADGES.map(([c,e,n,d]) => { const b = mine.find(x => x.code === c); return cell(e, n, d, got.has(c), b && b.earned_at); }).join("")}

  <div class="card"><h3>🎓 습관 졸업</h3><div class="sub">같은 루틴을 <b>30번 연속</b> 해내면 '진짜 내 습관'으로 졸업해요.</div>
    ${habits.map(b => `<div class="row"><div class="t"><b>🎓 ${esc(b.label)}</b><small>${b.earned_at.slice(0,10)} 졸업</small></div><span class="badge ok">졸업</span></div>`).join("")}
    ${prog.habits.filter(h => !got.has("habit:" + h.routine_id)).map(h => `<div style="margin:8px 0">
      <div class="kv"><span>${esc(h.label)}</span><b>${h.streak} / 30</b></div>
      <div class="bar"><i style="width:${Math.min(100, Math.round(h.streak / 30 * 100))}%"></i></div></div>`).join("") || (habits.length ? "" : '<div class="empty">루틴이 생기면 여기서 진행 상황을 볼 수 있어요</div>')}
  </div>`;
}

async function delRule(id){ if (confirm("이 규칙을 지울까요?")) { await call("delete_rule", { p_rule:id }); await load(); } }

/* ---------- 리포트 ---------- */
function vReport(){
  const list = S.entries.filter(e => e.child_id === S.sel && e.kind !== "cancel");
  const cx = canceledIds();
  const days = [...Array(14)].map((_,i) => dayAgo(13-i));
  const earned = days.map(d => list.filter(e => e.occurred_on===d && e.points>0 && !cx.has(e.id)).reduce((a,e)=>a+e.points,0));
  const max = Math.max(10, ...earned);
  const b = balOf(S.sel), goal = me().weekly_goal || 0;
  const rate = days.slice(-7).map(d => stat(todosOf(S.sel,d))).filter(s=>s.n);
  const avg = rate.length ? Math.round(rate.reduce((a,s)=>a+s.pct,0)/rate.length) : 0;
  const byCat = {}; list.filter(e => e.points<0 && !cx.has(e.id)).forEach(e => byCat[e.category||"기타"] = (byCat[e.category||"기타"]||0) - e.points);
  // 나의 최고 기록: 주(월~일) 단위 받은 점수, 연속 기록
  const weekKey = d => { const x = new Date(d + "T00:00:00Z"); x.setUTCDate(x.getUTCDate() - ((x.getUTCDay() + 6) % 7)); return x.toISOString().slice(0,10); };
  const weeks = {}; list.filter(e => e.points > 0 && !cx.has(e.id)).forEach(e => { const k = weekKey(e.occurred_on); weeks[k] = (weeks[k]||0) + e.points; });
  const thisW = weeks[weekKey(todayStr())] || 0, lastW = weeks[weekKey(dayAgo(7))] || 0;
  const bestW = Math.max(0, ...Object.entries(weeks).filter(([k]) => k !== weekKey(todayStr())).map(([,v]) => v));
  let run = 0, bestRun = 0; for (let i = 60; i >= 1; i--) { const l = todosOf(S.sel, dayAgo(i));
    if (l.length && l.every(t => t.status === "approved")) { run++; bestRun = Math.max(bestRun, run); } else run = 0; }
  const curStreak = (S.prog[S.sel] && S.prog[S.sel].streak) || 0; bestRun = Math.max(bestRun, curStreak);
  const best = `<div class="card"><h3>🥇 나의 최고 기록</h3><div class="sub">형제가 아니라 <b>지난 나</b>와 비교해요.</div>
    <div class="kv"><span>이번 주 받은 점수</span><b>${thisW}점 ${thisW>bestW&&bestW?"🎉 최고 기록!":""}</b></div>
    <div class="kv"><span>지난주</span><b>${lastW}점 ${thisW>lastW?`<span class="plus">(+${thisW-lastW})</span>`:""}</b></div>
    <div class="kv"><span>내 최고 주</span><b>${bestW}점</b></div>
    ${bestW?`<div class="bar g"><i style="width:${Math.min(100,Math.round(thisW/bestW*100))}%"></i></div><div class="hint">최고 기록까지 ${Math.max(0,bestW-thisW)}점 남았어요</div>`:""}
    <div class="divider"></div>
    <div class="kv"><span>지금 연속</span><b>🔥 ${curStreak}일</b></div>
    <div class="kv"><span>최고 연속 (최근 60일)</span><b>${bestRun}일</b></div></div>`;
  return best + `<div class="card"><h3>📈 최근 14일 받은 점수</h3>
    <div class="gbars">${earned.map(v=>`<div class="col"><div class="p" style="height:${Math.round(v/max*100)}%" title="${v}"></div></div>`).join("")}</div>
    <div class="glabels">${days.map((d,i)=>`<div>${i%2?"":d.slice(8)}</div>`).join("")}</div></div>
  <div class="card"><h3>🗓️ 이번 주 (최근 7일)</h3>
    <div class="kv"><span>받은 점수</span><b class="plus">+${b.week_earned}점</b></div>
    <div class="kv"><span>쓴 점수</span><b class="minus">-${b.week_spent}점</b></div>
    ${goal?`<div class="kv"><span>주간 목표 ${goal}점</span><b>${Math.min(100,Math.round(b.week_earned/goal*100))}%</b></div>
      <div class="bar"><i style="width:${Math.min(100,Math.round(b.week_earned/goal*100))}%"></i></div>`:""}
    <div class="kv" style="margin-top:6px"><span>할 일 평균 달성률</span><b>${avg}%</b></div></div>
  <div class="card"><h3>🛒 어디에 썼나 (전체)</h3>
    ${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="kv"><span>${esc(catOf(c).emoji)} ${esc(c)}</span><b>${v}점</b></div>`).join(""):'<div class="empty">아직 쓴 기록이 없어요</div>'}</div>`;
}

async function saveRemind(){ const t = [...new Set(S.draft.times.map(x => String(x).slice(0,5)).filter(x => /^\d\d:\d\d$/.test(x)))].sort();
  if (!await call("update_family", { p: { remind_times:t } })) return;
  closeSheet(); toast(t.length ? `알림 시간 ${t.length}개 저장했어요 ⏰` : "정기 알림을 껐어요"); await load(); }

function sheetKids(){
  openSheet(`<h3 style="margin-top:0">👧 아이 추가·수정</h3>
    ${S.kids.map(k=>`<div class="kidform"><div style="display:flex;gap:8px;align-items:center">
      <select style="width:72px;font-size:20px;padding:6px" id="ke_${k.id}">${EMOJIS.concat(EMOJIS.includes(k.emoji)?[]:[k.emoji]).map(e=>`<option ${e===k.emoji?"selected":""}>${e}</option>`).join("")}</select>
      <input id="kn_${k.id}" value="${esc(k.name)}" maxlength="20"></div>
      <div class="grid2" style="margin-top:6px"><div><label class="f">주간 목표 점수</label><input id="kg_${k.id}" type="number" value="${k.weekly_goal}"></div>
      <div style="display:flex;gap:6px;align-items:flex-end"><button class="btn sm solid" onclick="saveKid('${k.id}')">저장</button><button class="btn sm ghost" onclick="archiveKid('${k.id}')">숨기기</button></div></div></div>`).join("")}
    <div class="divider"></div><label class="f">새 아이</label>
    <div style="display:flex;gap:8px"><select id="nke" style="width:72px;font-size:20px;padding:6px">${EMOJIS.map(e=>`<option>${e}</option>`).join("")}</select><input id="nkn" placeholder="이름(별명)" maxlength="20"></div>
    <button class="btn solid wide" onclick="addKid()">＋ 아이 추가</button>
    <div class="hint">'숨기기'를 하면 목록에서 빠지고 그 아이 기기 연결도 해제돼요. 지난 기록은 남아요.</div>`);
}
async function saveKid(id){ if (await call("upsert_child", { p: { id, name:$("#kn_"+id).value.trim(), emoji:$("#ke_"+id).value, weekly_goal:+$("#kg_"+id).value } })) toast("저장했어요"); await load(); sheetKids(); }
async function addKid(){ const name = $("#nkn").value.trim(); if (!name) return toast("이름을 써주세요");
  if (await call("upsert_child", { p: { name, emoji:$("#nke").value, color:COLORS[S.kids.length % COLORS.length] } })) toast("추가했어요"); await load(); sheetKids(); }
async function archiveKid(id){ const k = S.kids.find(x => x.id === id);
  if (!confirm(`${k.name}을(를) 숨길까요? 기록은 남고, 그 아이 기기 연결은 해제돼요.`)) return;
  await call("archive_child", { p_child:id }); await load(); sheetKids(); }

function sheetPairCode(){
  openSheet(`<h3 style="margin-top:0">📱 아이 기기 연결</h3>
    <div class="sub">어느 아이의 폰인가요?</div>
    ${S.kids.map(k=>`<button class="btn solid wide" onclick="makePair('child','${k.id}')">${esc(k.emoji)} ${esc(k.name)} 폰</button>`).join("")}
    <button class="btn ghost wide" onclick="makePair('shared')">👨‍👩‍👧 가족 공용 태블릿 (아이를 골라 씀)</button>
    <div class="hint">공용 기기는 모든 아이의 할 일 체크·신청을 할 수 있어요. 승인·점수 주기는 부모 폰에서만 돼요.</div>`);
}
async function makePair(mode, childId){
  const r = await call("create_join_code", { p_kind:"device", p_child:childId || null, p_mode:mode }); if (!r) return;
  showCode(r.code, mode === "shared" ? "👨‍👩‍👧 공용 기기" : (S.kids.find(k=>k.id===childId)||{}).name + " 폰",
    "아이 폰에서 아래 주소를 열고 코드를 입력하거나, 카메라로 QR을 찍으세요. <b>10분</b> 동안만 쓸 수 있어요.");
}
function sheetInvite(){
  openSheet(`<h3 style="margin-top:0">💌 배우자 초대</h3><div class="sub">초대받은 사람은 Google로 로그인한 뒤 '초대 코드'에 입력하면 같은 가족을 관리할 수 있어요. 코드는 24시간 동안 1번 쓸 수 있어요.</div>
    <button class="btn solid wide" onclick="makeInvite()">초대 코드 만들기</button>`);
}
async function makeInvite(){ const r = await call("create_join_code", { p_kind:"parent" }); if (!r) return;
  showCode(r.code, "배우자 초대", "배우자에게 이 앱 주소와 코드를 보내 주세요. Google 로그인 → '배우자에게 초대받았나요?'에 입력하면 돼요.", true); }
function showCode(code, title, desc, noQr){
  const pretty = code.slice(0,4) + "-" + code.slice(4);
  const url = location.origin + location.pathname + "?code=" + code;
  openSheet(`<h3 style="margin-top:0">${esc(title)}</h3><div class="sub">${desc}</div>
    <div class="code">${pretty}</div>${noQr?"":'<div class="qr" id="qr"></div>'}
    <div class="hint" style="text-align:center;word-break:break-all">${esc(location.origin + location.pathname)}</div>
    <button class="btn ghost wide" onclick="copyText('${noQr ? esc(location.origin + location.pathname) + " 초대코드 " + pretty : url}')">복사하기</button>`);
  if (!noQr && window.QRCode) new QRCode($("#qr"), { text:url, width:180, height:180 });
}
function copyText(t){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("복사했어요"), () => prompt("복사하세요", t)); }

function sheetDevice(){
  openSheet(`<h3 style="margin-top:0">📱 이 기기</h3>
    <div class="kv"><span>가족</span><b>${esc(S.fam.name)}</b></div>
    <div class="kv"><span>연결</span><b>${S.me.mode==="shared"?"가족 공용":esc(me().name)+" 전용"}</b></div>
    <div class="hint">점수 주기·승인은 부모님 폰에서만 할 수 있어요. 기기를 바꾸면 부모님께 새 연결 코드를 받으세요.</div>
    <button class="btn danger wide" onclick="if(confirm('이 기기 연결을 끊을까요? 다시 쓰려면 새 코드가 필요해요.'))resetLogin()">이 기기 연결 끊기</button>`);
}
function sheetLeave(){
  const multi = S.members.length > 1;
  openSheet(`<h3 style="margin-top:0">🚪 탈퇴</h3>
    ${multi?`<div class="sub">다른 부모가 있어서 <b>나만 가족에서 빠지고</b> 기록은 남아요.</div>
      <button class="btn danger wide" onclick="doLeave(null)">나만 빠지기</button>`
    :`<div class="sub"><b>가족의 모든 데이터(아이, 기록, 목표, 기기 연결)가 영구히 삭제돼요.</b> 되돌릴 수 없어요. 필요하면 먼저 '기록 내보내기'로 저장하세요.</div>
      <label class="f">확인을 위해 가족 이름 <b>${esc(S.fam.name)}</b> 을 입력하세요</label><input id="lv">
      <button class="btn danger wide" onclick="doLeave($('#lv').value)">가족 데이터 전부 삭제</button>`}`);
}
async function doLeave(confirmName){ const r = await call("leave_family", { p_confirm:confirmName }); if (!r) return;
  await sb.auth.signOut(); alert("탈퇴했어요. 이용해 주셔서 고마워요."); location.href = location.pathname; }
function exportCsv(){
  const cx = canceledIds(), nm = id => (S.kids.find(k => k.id === id) || {}).name || "";
  const rows = [["날짜","아이","종류","내용","원점수","가중치","점수","카테고리","메모","취소됨"]].concat(
    S.entries.slice().reverse().map(e => [e.occurred_on, nm(e.child_id), e.kind, e.label, e.raw_points, e.weight, e.points, e.category||"", e.memo||"", cx.has(e.id)?"Y":""]));
  const csv = "\ufeff" + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv" }));
  a.download = `포인트기록_${todayStr()}.csv`; a.click();
}

/* ================= 푸시 알림 ================= */
const pushOk = ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window);
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function b64(s){ s = s.replace(/-/g,"+").replace(/_/g,"/"); s += "===".slice((s.length+3)%4); const r = atob(s), a = new Uint8Array(r.length); for (let i=0;i<r.length;i++) a[i] = r.charCodeAt(i); return a; }
async function curSub(){ try { const r = await navigator.serviceWorker.getRegistration("./"); return r ? await r.pushManager.getSubscription() : null; } catch(e) { return null; } }
async function updateBell(){ $("#bell").textContent = (pushOk && await curSub()) ? "🔔" : "🔕"; }
function initPush(){ updateBell(); $("#bell").onclick = pushSheet; }
async function pushSheet(){
  if (ios && !standalone) return openSheet(`<h3 style="margin-top:0">🔔 알림 켜기 (아이폰)</h3><div class="sub" style="line-height:1.7">아이폰은 <b>홈 화면에 추가한 앱</b>에서만 알림을 받을 수 있어요.<br>① 사파리 아래 <b>공유 버튼(⬆️)</b><br>② <b>홈 화면에 추가</b><br>③ 홈 화면의 아이콘으로 열고 🔔 다시 누르기<br><small>iOS 16.4 이상 필요</small></div>`);
  if (!pushOk) return openSheet(`<h3 style="margin-top:0">이 브라우저는 알림을 지원하지 않아요</h3><div class="sub">크롬(안드로이드)이나 홈 화면에 추가한 사파리(아이폰)에서 열어 주세요.</div>`);
  const s = await curSub();
  openSheet(`<h3 style="margin-top:0">🔔 알림 설정</h3>
    <div class="sub">이 기기: <b>${s?"켜짐":"꺼짐"}</b> — ${isParent()?"아이 신청·완료 체크·정기 현황":"점수를 받거나 쓸 때·정기 현황"} 알림</div>
    <button class="btn solid wide" onclick="pushOn()">${s?"다시 등록":"알림 켜기"}</button>
    ${s?'<button class="btn ghost wide" onclick="pushTest()">테스트 알림 보내기</button><button class="btn ghost wide" onclick="pushOff()">이 기기 알림 끄기</button>':""}`);
}
async function pushOn(){
  try {
    if (await Notification.requestPermission() !== "granted") return toast("알림이 허용되지 않았어요. 폰 설정에서 허용해 주세요");
    const reg = await navigator.serviceWorker.register("./sw.js"); await navigator.serviceWorker.ready;
    const { data: key } = await sb.rpc("push_vapid"); if (!key) return toast("서버 알림 설정이 아직 안 됐어요");
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64(key) });
    const j = sub.toJSON();
    const r = await call("push_subscribe", { p: { endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth,
      role: isParent() ? "parent" : "child", child_id: S.sel, ua: navigator.userAgent } });
    if (!r) return; closeSheet(); toast("알림을 켰어요 🔔"); updateBell();
  } catch(e) { console.error(e); toast("알림 설정 실패: " + (e && e.message || e)); }
}
async function pushTest(){ const s = await curSub(); if (s && await call("push_test", { p_endpoint:s.endpoint })) toast("테스트 알림을 보냈어요"); }
async function pushOff(){ const s = await curSub(); if (s) { await sb.rpc("push_unsubscribe", { p_endpoint:s.endpoint }); try { await s.unsubscribe(); } catch(e) {} }
  closeSheet(); toast("알림을 껐어요"); updateBell(); }

// 다른 탭에서 로그아웃/로그인하면 새로고침
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_OUT" && S.me) location.reload(); });
boot().catch(e => { $("#view").innerHTML = errorCard(e); console.error(e); });
</script>
