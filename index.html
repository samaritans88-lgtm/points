<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFB703">
<title>우리집 포인트 통장</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포인트통장">
<style>
html,body{margin:0;background:#F4F6FB;color:#151823;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
@media(prefers-color-scheme:dark){html,body{background:#0F1117;color:#E9ECF3}}
#boot{padding:80px 24px;text-align:center;font-size:14px;line-height:1.7;opacity:.65}
#boot button{margin-top:14px;padding:9px 18px;border:0;border-radius:999px;background:#FFB703;color:#1a1200;font:inherit;font-weight:700}
</style>
</head>
<body>
<div id="boot">🪙<br>불러오는 중…</div>
<script>
(async function(){
  var SB="https://ytzhsnfqlzohxmdxocay.supabase.co";
  var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0emhzbmZxbHpvaHhtZHhvY2F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMTc4MzUsImV4cCI6MjEwMzc5MzgzNX0.0xqV_G9t16-YdqtSIIhvSSCFIlu5T7ATf0-aY6cd5G0";
  var boot=document.getElementById("boot");
  var errs=[];

  async function viaFunction(){
    var r=await fetch(SB+"/functions/v1/points/app",{cache:"no-store"});
    if(!r.ok) throw new Error("fn "+r.status);
    var j=await r.json();
    if(!j||!j.body) throw new Error("fn empty");
    return j.body;
  }
  async function viaRest(){
    var r=await fetch(SB+"/rest/v1/kp_app?id=eq.app&select=body",
      {headers:{apikey:KEY,Authorization:"Bearer "+KEY},cache:"no-store"});
    if(!r.ok) throw new Error("rest "+r.status);
    var j=await r.json();
    if(!j||!j[0]||!j[0].body) throw new Error("rest empty");
    return j[0].body;
  }

  var src=null;
  for (var fn of [viaFunction, viaRest]) {
    try { src = await fn(); break; } catch(e){ errs.push(String(e&&e.message||e)); }
  }
  if(src){
    try{ localStorage.setItem("kp_cache", src) }catch(e){}
    mount(src);
  } else {
    var c=null; try{ c=localStorage.getItem("kp_cache") }catch(e){}
    if(c){ mount(c); }
    else if(boot){
      boot.innerHTML='앱을 불러오지 못했어요<br><small>'+errs.join(" / ")+'</small><br><button onclick="location.reload()">다시 시도</button>';
    }
  }

  function mount(src){
    var box=document.createElement("div");
    box.innerHTML=src;
    var scripts=[].slice.call(box.querySelectorAll("script"));
    scripts.forEach(function(s){ s.parentNode.removeChild(s) });
    if(boot&&boot.parentNode) boot.parentNode.removeChild(boot);
    while(box.firstChild) document.body.appendChild(box.firstChild);
    scripts.forEach(function(old){
      var s=document.createElement("script");
      s.textContent=old.textContent;
      document.body.appendChild(s);
    });
    try{ remindPatch(); }catch(e){ console.error("remindPatch", e); }
    try{ catPatch(); }catch(e){ console.error("catPatch", e); }
  }

  // 가중치 편집 시트 아래에 '새 카테고리 추가' 폼을 붙인다. 저장은 기존 kp_admin upsert_category.
  function catPatch(){
    if(typeof sheetCat!=="function"||typeof S==="undefined"||typeof window.addCat==="function")return;
    var base=sheetCat;
    sheetCat=function(){
      base();
      var inn=document.getElementById("sheetIn"),close=inn&&inn.lastElementChild;
      if(!close)return;
      close.insertAdjacentHTML("beforebegin",
        '<div class="divider"></div><label class="f">새 카테고리 추가</label>'
        +'<div style="display:flex;gap:8px"><input id="ncE" style="width:64px;text-align:center" placeholder="🏷️" maxlength="4">'
        +'<input id="ncN" style="flex:1" placeholder="이름 (예: 게임)" maxlength="20"></div>'
        +'<div class="grid2"><div><label class="f">가중치 (배)</label><input id="ncW" type="number" step="0.1" min="0.1" max="5" inputmode="decimal" value="1.0"></div>'
        +'<div><label class="f">설명 (선택)</label><input id="ncH" placeholder="예: 스위치 칩" maxlength="40"></div></div>'
        +'<div class="hint">1.0 = 정가 그대로 · 0.5 = 반값 · 1.3 = 30% 더 비싸게</div>'
        +'<button class="btn solid" style="width:100%;margin-top:10px" onclick="addCat()">＋ 카테고리 추가</button>');
    };
    window.addCat=async function(){
      var name=document.getElementById("ncN").value.trim(),w=parseFloat(document.getElementById("ncW").value);
      if(!name)return toast("이름을 써주세요");
      if(!(w>=0.1&&w<=5))return toast("가중치는 0.1 ~ 5 사이로 해주세요");
      if(S.cats.some(function(c){return c.name===name})&&!confirm("'"+name+"' 카테고리가 이미 있어요. 덮어쓸까요?"))return;
      var sort=S.cats.filter(function(c){return c.name!=="이전기록"}).reduce(function(a,c){return Math.max(a,c.sort||0)},0)+1;
      if(!await admin("upsert_category",{name:name,weight:Math.round(w*100)/100,
        emoji:document.getElementById("ncE").value.trim()||"🏷️",hint:document.getElementById("ncH").value.trim()||null,sort:sort}))return;
      toast("'"+name+"' 카테고리를 추가했어요");await load();sheetCat();
    };
  }

  // 정기 알림 시간 설정 (부모 모드 → 관리 탭). 시간은 kp_config.remind_times 에 저장되고
  // 서버(pg_cron → kp_remind_tick)가 매분 확인해 그 시각에 알림을 보낸다.
  function remindPatch(){
    if(typeof vAdmin!=="function"||typeof S==="undefined"||typeof window.sheetRemind==="function")return;
    window.remindTimes=function(){var v=S.cfg.remind_times;return Array.isArray(v)?v.slice().sort():[];};
    var base=vAdmin;
    vAdmin=function(){
      var html=base();
      var card='<div class="card"><h3>⏰ 정기 알림 시간</h3>'
        +'<div class="sub">이 시각마다 오늘 받은 점수 · 현재 점수 · 남은 점수(%)를 알림으로 보내요. 🔔 알림을 켠 기기만 받아요.</div>'
        +'<div class="chips">'+(remindTimes().map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join("")
          ||'<span class="hint" style="margin:0">설정된 시간이 없어요 (정기 알림 꺼짐)</span>')+'</div>'
        +'<button class="btn solid" style="width:100%;margin-top:10px" onclick="sheetRemind()">⏰ 알림 시간 바꾸기</button></div>\n';
      var at=html.indexOf('<div class="card">\n    <h3>⚙️ 설정</h3>');
      return at<0?html+card:html.slice(0,at)+card+html.slice(at);
    };
    window.sheetRemind=function(){
      if(!S.draft||!S.draft.times)S.draft={times:remindTimes()};
      openSheet('<h3 style="margin-top:0">⏰ 정기 알림 시간</h3>'
        +'<div class="hint" style="margin:0 0 10px">시간을 눌러 바꾸고, ✕로 지우고, 아래 버튼으로 추가하세요. 다 바꾼 뒤 <b>저장</b>을 눌러야 적용돼요.</div>'
        +(S.draft.times.map(function(t,i){
            return '<div class="row"><input type="time" value="'+esc(t)+'" onchange="S.draft.times['+i+']=this.value" style="flex:1">'
              +'<button class="btn sm ghost" onclick="S.draft.times.splice('+i+',1);sheetRemind()">✕</button></div>';
          }).join("")||'<div class="empty">알림 시간이 없어요</div>')
        +'<button class="btn ghost" style="width:100%;margin-top:10px" onclick="S.draft.times.push(\'20:00\');sheetRemind()">＋ 시간 추가</button>'
        +'<button class="btn gold" style="width:100%;margin-top:8px" onclick="saveRemind()">저장</button>');
    };
    window.saveRemind=async function(){
      var t=S.draft.times.map(function(x){return String(x).slice(0,5)}).filter(function(x){return /^\d\d:\d\d$/.test(x)});
      t=t.filter(function(x,i){return t.indexOf(x)===i}).sort();
      if(!await admin("set_config",{k:"remind_times",v:t}))return;
      closeSheet();toast(t.length?"알림 시간 "+t.length+"개 저장했어요 ⏰":"정기 알림을 껐어요");await load();
    };
  }
})();
</script>
</body>
</html>
